task:
  description: >
    General static-obstacle avoidance for 6.5.2. Candidate routes may pass
    above or around obstacles. The final route is not chosen by a flat-Z or
    overpass preference, but by geometric route classification and fixed-scale
    layered execution cost.
  tcp_z_hard_tolerance_m: 0.0
  tcp_orientation_hard_deg: 0.0
  note: >
    TCP height and orientation are reported as diagnostics. A true overpass is
    defined by the TCP/tool route crossing the core obstacle XY footprint with
    sufficient vertical clearance over the robust obstacle top, not by TCP
    z-change alone. Full robot swept geometry is still checked by the dense
    verifier, but it is not used to label a TCP route as an overpass.

safety:
  dense_accept_m: 0.080
  real_execution_margin_m: 0.000
  table_clearance_m: null
  base_self_clearance_m: null
  note: >
    Dense robot-obstacle clearance is enforced in code.  Table/base/self checks
    require a separate calibrated geometry module before being used as hard
    execution gates.

candidate_families:
  - free_reference_seed
  - base_side_corridor
  - outer_side_corridor
  - overpass_corridor

optimization:
  max_iterations: 300
  soft_regularization:
    lambda_tcp_z: 0.0
    lambda_tcp_xy: 0.0
    lambda_joint_deviation: 0.0

selection:
  mode: layered_fixed_scale_time_then_lexicographic
  hard_gates:
    - solver_ok
    - dense_distance_ok
    - route_geometry_ok
    - route_family_preserved_if_enabled
    - joint_limits_ok
    - trajectory_continuity_ok
    - goal_ok
  route_classification:
    xy_footprint_inflation_m: 0.080
    overpass_z_deviation_m: 0.090
    lateral_xy_deviation_m: 0.060
    vertical_uncertainty_m: 0.020
    robust_obstacle_top: p99
    true_overpass_definition: >
      TCP/tool samples enter the core obstacle XY footprint and both the TCP
      height and the configured tool/end-effector surface bottom inside that
      footprint are no lower than obstacle_top_p99 + d_accept +
      vertical_uncertainty.
    diagnostic_inflated_projection: >
      TCP and full robot swept surface intersections with the inflated obstacle
      footprint are recorded for analysis. These diagnostics do not by
      themselves define a true overpass.
  route_family_constraints:
    base_side_outer_side: >
      During the obstacle-near segment, TCP samples must remain on the requested
      lateral side of the obstacle with the configured XY margin. Side-route
      families additionally keep obstacle-near TCP height close to the reference
      height, so a base-side seed cannot collapse back into a vertical overpass.
    overpass: >
      During the obstacle-near segment, TCP samples inside the obstacle footprint
      must remain above obstacle_top_p99 + d_accept + vertical_uncertainty.
  time_scaling:
    use_velocity_and_acceleration_limits: true
    near_best_time_ratio: 1.050
  objectives:
    - required_execution_time_s
    - tcp_path_length_m
    - joint_path_length_rad
    - jerk_energy
    - clearance_penalty
  order: >
    First keep all hard-feasible candidates. Estimate required execution time
    under the same velocity and acceleration limits. Keep candidates with
    T_req <= 1.05 * T_req_best. Among those, select lexicographically by
    L_TCP, L_q, J_jerk, and J_clear.
  fixed_scale_costs:
    - tcp_path_length_ratio
    - tcp_extra_ratio
    - joint_path_length_rad
    - joint_path_ratio
    - jerk_energy
    - jerk_ratio
    - clearance_penalty
    - duration_s
  clearance_pref_m: 0.110

  g1_min_active_a_norm: 0.02
  g1_reference_dense_min_range: [0.04, 0.08]
  g1_near_dense_min_range: [0.07, 0.08]
  g1_bands:
    near: [0.070, 0.080]
    easy: [0.075, 0.080]

  d_replan_out: 0.38
  d_slow: 0.12
  d_stop: 0.08
  d_accept: 0.08
  d_online_accept: 0.09
replanner:
  planning_budget: 5.5
  planned_switch_delay: 6.0
  stress_switch_delay: 3.0

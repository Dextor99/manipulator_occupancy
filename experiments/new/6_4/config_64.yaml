  v4:
    max_iterations: 1
    target_clearance: 0.095
    clearance_reward: 0.0
    acceptance_scales: [0.85, 0.65, 0.45, 0.30, 0.20, 0.10]
    projection_sweeps: 8
    drive_scale: 0.75
  conflict_time_groups:
    Long: 0.90
    Medium: 0.60
    Short: 0.35
optimizer:
  density: coarse
  max_iterations: 35
  risk_samples_per_segment: 4
  samples_per_segment: 6
validation:
  density: medium
  dense_time_step: 0.04
  epsilon_goal: 0.01
  epsilon_continuity_q: 5.0e-3
  epsilon_continuity_qd: 3.0e-3
  epsilon_continuity_qdd: 3.0e-3
